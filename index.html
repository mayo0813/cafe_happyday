<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>카페 해피데이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 귀엽고 경쾌한 타이쿤, 그 아래 아주 작은 어긋남
   IDEA: 카페 카운터 그 자체 — 손님, 컵, 재료 버튼, 구석의 CCTV
   PICTURE: 파스텔 벽 앞 손님 + 카운터
   COLOUR and TYPE: 크림 바탕, 코랄 주색, 민트 보조, 우드 / Jua + Gowun Dodum
   LAYOUT: 세로 한 열, 폰 기준 한 화면 */
:root{color-scheme:light;--o:#2e2a3a;--bg:#fff4e4;--ink:#4a3b32;--coral:#f08a7e;--mint:#8fd3bf;--cream:#fffaf2;--wood:#d9a77a;--wood2:#b9845a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2b2320;font:16px/1.45 "Gowun Dodum",system-ui,sans-serif;color:var(--ink);overflow:hidden}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.jua{font-family:"Jua",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;background:#ffd7a8;color:var(--o);font-family:"Jua";font-size:15px;border-bottom:3px solid var(--o)}
header span{background:#fff;border:2.5px solid var(--o);border-radius:99px;padding:2px 10px;white-space:nowrap}
header button{font:inherit;font-size:13px;background:var(--coral);color:#fff;border:2.5px solid var(--o);border-radius:99px;padding:3px 10px;min-height:30px}
#stage{position:relative;flex:1;min-height:240px;background:#fde9cf;overflow:hidden}
#cam{position:absolute;top:10px;right:10px;width:29%;aspect-ratio:5/4;z-index:3;image-rendering:pixelated;border:3px solid var(--o);background:#222;box-shadow:0 3px 0 var(--o)}
#cam.click{cursor:pointer;animation:cc 1s steps(2) infinite}
@keyframes cc{50%{border-color:#f08a7e;box-shadow:0 0 0 3px #f08a7e}}
#scn{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#app.dist3{filter:saturate(.8)}#app.dist4{filter:saturate(.5) contrast(1.06)}#app.dist5{filter:saturate(.6) contrast(1.12)}
#bubble{position:absolute;top:10px;left:10px;right:33%;z-index:3;background:#fff;border:3px solid var(--o);border-radius:4px;padding:9px 12px 11px;font-size:16px;box-shadow:0 4px 0 var(--o);opacity:0;transform:scale(.92);transition:opacity .25s,transform .25s}
#bubble::after{content:"";position:absolute;bottom:-12px;right:34%;width:16px;height:16px;background:#fff;border-right:3px solid var(--o);border-bottom:3px solid var(--o);transform:rotate(45deg)}
#bubble.on{opacity:1;transform:none}
#bubble .who{font-family:"Jua";font-size:12px;color:var(--coral);display:block}
#pat{height:8px;border-radius:9px;background:#f1e6dc;border:2px solid var(--o);margin-top:8px;overflow:hidden}
#pat i{display:block;height:100%;width:100%;background:var(--mint);transition:width .1s linear}
#pat i.low{background:var(--coral)}
#sorry{position:absolute;left:12px;bottom:14px;z-index:6;min-height:48px;padding:0 18px;background:var(--coral);color:#fff;font-size:17px;display:none}
#sorry.on{display:block;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.7)}to{transform:none}}
#say.glitch{color:#c0392b;display:inline-block;animation:shk .08s linear infinite}
@keyframes shk{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
#mine{position:absolute;right:12px;bottom:14px;z-index:6;max-width:62%;background:#fff;border:2.5px dashed #8fd3bf;border-radius:14px;padding:6px 10px;font-size:14px;color:#5a7f74;opacity:0;transition:opacity .3s;pointer-events:none}
#mine.on{opacity:1}
#mine::before{content:'나';display:block;font-family:Jua;font-size:11px;color:#8fd3bf}
@keyframes cc{50%{box-shadow:0 0 0 4px rgba(240,138,126,.7),0 3px 0 var(--o)}}
#closeup{position:absolute;inset:0;z-index:40;background:#2a0607;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}#closeup[hidden]{display:none}#closeup canvas{width:min(86vw,62vh);image-rendering:pixelated;border:4px solid #e6efe9}#closeup p{color:#e6efe9;font-family:'Gowun Dodum',sans-serif;letter-spacing:.3em;font-size:18px;margin:0}
#big{position:absolute;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;align-items:stretch;justify-content:center}
#big[hidden]{display:none}
#bigF{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden}
#bigF::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px);pointer-events:none}
#bigL{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font:12px monospace;color:#ddd;z-index:2}
#bigL b{color:#f44;font-weight:400}
#bigSay{position:absolute;left:8%;top:12%;max-width:58%;background:#ddd;color:#111;border:2px solid #111;padding:4px 8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:3}#bigSay.on{opacity:1}#bigSay span{display:block;font-size:10px;color:#555}
#bigT{color:#ccc;text-align:center;padding:22px;font-size:16px;line-height:1.9;min-height:120px}
#bigT p{margin:0;opacity:0;transition:opacity 1.2s}#bigT p.on{opacity:1}
#choice{position:absolute;left:10px;right:10px;bottom:12px;z-index:7;display:none;gap:8px}#choice.on{display:flex}#choice .btn{flex:1;font-size:14px;min-height:44px}
#whisper{position:absolute;left:0;right:0;bottom:40%;text-align:center;z-index:4;color:rgba(70,55,50,.0);font-size:15px;letter-spacing:.08em;pointer-events:none;transition:color .5s}
#whisper.on{color:rgba(70,55,50,.38)}
#card{position:absolute;left:50%;bottom:30%;width:44px;height:28px;border-radius:4px;background:linear-gradient(135deg,#6a7fb0,#3c4d78);z-index:5;opacity:0}
#card.fly{animation:fly .6s ease-in forwards}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-40px) rotate(0)}55%{opacity:1;transform:translate(-30%,90px) rotate(200deg)}100%{opacity:0;transform:translate(-30%,90px) rotate(200deg)}}
#counter{min-height:118px;background:#f3c896;border-top:3px solid var(--o);box-shadow:inset 0 9px 0 #fbe0b8,inset 0 12px 0 var(--o);display:flex;gap:10px;padding:20px 12px 10px;border-bottom:3px solid var(--o)}
#cupWrap{width:96px;display:flex;flex-direction:column;align-items:center}
#cup{position:relative;width:62px;height:76px;border:3px solid var(--o);border-top:0;border-radius:0 0 12px 12px;background:rgba(255,255,255,.35);display:flex;flex-direction:column-reverse;overflow:hidden}
#cup .ly{width:100%;transition:height .2s}
#cup .ice{position:absolute;width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.75);border:1px solid #cfe7f2}
#cupTxt{font-size:11px;color:var(--o);margin-top:4px;text-align:center;line-height:1.2;min-height:14px}
#recipe{position:relative;flex:1;background:#fff3c4;border:2.5px solid var(--o);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.45;box-shadow:0 3px 0 var(--o);transform:rotate(-1.5deg)}
#recipe::before{content:"";position:absolute;top:-9px;left:50%;width:44px;height:14px;margin-left:-22px;background:rgba(143,211,191,.8);border-radius:3px;transform:rotate(3deg)}
#recipe b{font-family:"Jua";font-weight:400;font-size:13px;color:var(--coral)}
#controls,#smile{background:#fff7ea;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{font-family:"Jua";font-size:15px;border:3px solid var(--o);border-radius:4px;min-height:46px;background:#fff;color:var(--o);box-shadow:0 4px 0 var(--o)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--o)}
.btn:disabled{opacity:.45}
.btn .dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--o)}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}
.btn.serve{background:var(--coral);color:#fff}
.btn.trash{background:#f1e4d4}
#smile{display:none;align-items:center;gap:12px}
#smile.on{display:flex}
#me{width:84px;height:84px;border-radius:50%;background:#ffe2c2;border:3px solid var(--o);overflow:hidden;flex:none}
#smileR{flex:1}
#smileR p{margin:0 0 6px;font-size:13px}
#gauge{height:14px;border-radius:9px;background:#f1e4d4;border:2.5px solid var(--o);overflow:hidden;margin-bottom:8px}
#gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6b3a9,var(--coral))}
#hold{width:100%;min-height:52px;font-size:17px;background:var(--mint);touch-action:none}
#nameF{display:none;gap:8px}
#nameF.on{display:flex}
#nameIn{flex:1;font:16px "Gowun Dodum",sans-serif;border:2.5px solid var(--o);border-radius:12px;padding:0 12px;min-height:48px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
#nameIn:focus{outline:none;border-color:var(--coral)}
#nameF .btn{padding:0 16px;background:var(--coral);color:#fff}
#hold.down{transform:translateY(3px);box-shadow:0 1px 0 var(--o)}
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(255,236,210,.97)}
.ov[hidden]{display:none}
.panel{width:100%;max-width:340px;text-align:center}
.panel h1{font-family:"Jua";font-weight:400;font-size:46px;line-height:1.05;margin:0 0 6px;color:var(--coral);-webkit-text-stroke:1.5px var(--o);paint-order:stroke fill}
.panel h2{font-family:"Jua";font-weight:400;font-size:26px;margin:0 0 14px}
.panel p{margin:0 0 16px}
.panel .btn{width:100%;background:var(--coral);color:#fff}
#title .logo{width:130px;margin:0 auto 8px;display:block}
#boss{align-items:flex-end;background:rgba(74,59,50,.35)}
#boss .box{position:relative;width:100%;background:#fff;border:3px solid var(--o);border-radius:20px;padding:14px 16px 16px 88px;box-shadow:0 5px 0 var(--o);min-height:110px}
#bossAv{position:absolute;left:8px;bottom:8px;width:74px}
#boss .who{font-family:"Jua";color:var(--coral);font-size:14px}
#boss .txt{font-size:17px;margin:4px 0 10px;min-height:52px}
#boss .nx{font-size:12px;color:#a8968a;text-align:right}
table.sum{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:16px}
.sum td{padding:8px 4px;border-bottom:1px dashed #e2cfbf}
.sum td:last-child{text-align:right;white-space:nowrap;font-family:"Jua"}
#rcpt .panel{background:#fff;padding:16px;border-radius:6px;text-align:left;font:13px/1.6 monospace;max-height:70vh;overflow:auto;box-shadow:0 3px 0 rgba(0,0,0,.1)}
#rcpt .panel div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #ccc}
#home{background:#16110f;color:#d8ccc2;flex-direction:column;justify-content:flex-start;padding:0}
#room{position:relative;width:100%;height:56%;background:linear-gradient(#211915,#16110f)}
#mono{padding:18px 22px;font-size:16px;line-height:1.8;width:100%;min-height:120px}
#mono p{margin:0;opacity:0;transition:opacity .35s}
#tapHint{position:absolute;right:22px;bottom:18px;font-size:12px;color:#7a6d62;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#mono p.on{opacity:1}
#endBtn{margin:6px 22px 0;width:calc(100% - 44px);background:#2c2420;color:#b9aba0;box-shadow:none;opacity:0;transition:opacity 1s}
#endBtn.on{opacity:1}
@media(prefers-reduced-motion:reduce){#card.fly{animation:none}}

window.__dbg={get S(){return S},endDay:()=>endDay(),cu:k=>{$('closeup').hidden=false;drawCloseup($('cuC'),k)},meV:v=>meV(v),drawMe:v=>drawMe(v)};function meV(v){const d=dist();if(DAYS[S.day]&&DAYS[S.day].newbie)return v;if(d>=4)return 101;if(d>=3)return 100;if(d===2){_mlag=Math.max(v,_mlag-.8);return _mlag}return v}
const hb=$('hold');
const down=e=>{e.preventDefault();hold=true;hb.classList.add('down')},up=()=>{hold=false;hb.classList.remove('down')};
hb.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(t=>hb.addEventListener(t,up));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'&&S.phase==='smile')down(e)});addEventListener('keyup',e=>{if(e.code==='Space')up()});

function askName(){return new Promise(res=>{
 const f=$('nameF'),inp=$('nameIn');hold=false;hb.classList.remove('down');hb.style.display='none';f.classList.add('on');
 inp.value=NAME||prevName||'';$('smileTip').textContent='대답해야 할 것 같아요.';setTimeout(()=>{try{inp.focus()}catch(e){}},50);
 f.onsubmit=e=>{e.preventDefault();const v=inp.value.trim().slice(0,8);if(!v){inp.placeholder='이름을 말해야 해요';return}
  NAME=v;store.set('name',v);inp.blur();f.classList.remove('on');hb.style.display='';$('smileTip').textContent='버튼을 꾹 누르고 있으면 웃어요.';res(v)};
})}

async function smilePhase(){
 S.phase='smile';setFace(D().jinDirect?'neutral':'angry');if(D().holdLabel){hb.textContent=D().holdLabel;$('smileTip').textContent=D().holdTip}$('controls').style.display='none';$('smile').classList.add('on');
 let sum=0,n=0;sv=0;
 smileLoop=setInterval(()=>{sv=D().auto?(hold?Math.max(62,sv-3):Math.min(100,sv+6)):hold?Math.min(100,sv+7):Math.max(0,sv-(D().decay||10));drawMe(meV(sv));$('gauge').firstElementChild.style.width=sv+'%';sum+=sv;n++},50);
 $('pat').firstElementChild.style.width='0%';
 const PL=D().polite||[];let li=-1;
 for(const l of D().jin()){li++;
  if(l==='NAME'){say('너 이름 뭐야? 명찰은 왜 안 달았어?');snd(150,.25,'sawtooth',.05);const v=await askName();say(D().nameReply?D().nameReply(v):'흥. 기억해둔다.');snd(120,.4,'sawtooth',.05);await wait(2400);continue}
  say(l,D().jinWho&&D().jinWho[li]||undefined);snd(D().melt?90-li*10:150,.25,'sawtooth',.05);
  if(D().melt){const tgt=(li+1)/D().jin().length,st=SC.melt;for(let k=1;k<=20;k++){setTimeout(()=>{SC.melt=st+(tgt-st)*k/20},k*120)}}
  if(PL[li]&&PL[li]!==l){await wait(1100);say(PL[li]);await wait(260);say(l);await wait(1240)}else await wait(2600)
  if(li===1&&dist()>=2&&!D().melt)await closeup(dist()>=4?1700:dist()>=3?1200:450)}
 clearInterval(smileLoop);const avg=n?sum/n:0;
 S.sat-=Math.round((100-avg)*.25)+5;
 $('smileTip').textContent=D().endTip||(avg>=70?'잘 참았어요.':'표정이 굳었어요.');
 if(!D().noCard){const cd=$('card');cd.className='';void cd.offsetWidth;cd.className='fly';snd(700,.06,'square',.05);setTimeout(()=>cd.className='',1300)}
 pay(0);say(D().bye||'다신 안 와.',D().melt?'나':undefined);hud();
 await wait(400);sv=0;drawMe(0);
 await exitCust();
 $('smile').classList.remove('on');$('controls').style.display='';$('smileTip').textContent='버튼을 꾹 누르고 있으면 웃어요.';hb.textContent='꾹 눌러서 웃기';
 await wait(900);
 const w=$('whisper');w.textContent=D().whisper(avg);w.classList.add('on');await wait(1100);w.classList.remove('on');
 await wait(500);S.c=null;S.i++;next();
}

async function cctvEnd(){
 S.phase='ending';SC.cam2=0;$('bubble').classList.remove('on');$('sorry').classList.remove('on');
 const B=$('big'),T=$('bigT'),C=$('bigC'),BS=$('bigSay');T.innerHTML=['손님은 없었다.','주문하는 목소리도, 대답하는 목소리도','전부 내 목소리였다.'].map(t=>`<p>${t}</p>`).join('');
 B.hidden=false;snd(60,2,'sine',.08);const t0=performance.now();let ph=0,run=1;
 const anim=()=>{if(!run)return;drawReveal(C,performance.now()-t0,ph);requestAnimationFrame(anim)};anim();
 const tk=setInterval(()=>{$('bigCam').textContent='CAM 01 · 일 15:00:0'+(ph%3)},700);
 const L2=['아이스 아메리카노 하나 주세요!','네~ 아이스 아메리카노 나왔습니다!','감사합니다!'];
 for(let i=0;i<7;i++){BS.querySelector('b').textContent=L2[i%3];BS.classList.add('on');ph=i;snd(i%3===0?300:520,.1,'triangle',.05);await wait(1150);BS.classList.remove('on');await wait(250)}
 for(const p of T.children){await wait(1600);p.classList.add('on')}
 await wait(2600);run=0;clearInterval(tk);B.hidden=true;SC.look=null;S.c=null;S.cam2=0;endDay();
}
async function loopEnd(){
 S.phase='ending';store.set('loops',String((+store.get('loops')||0)+1));
 await wait(600);const F=$('fin'),T=$('finT');T.innerHTML=['카페 해피데이는','오늘도 알바생을 구합니다.','','<span style="font-family:Jua;font-size:30px;color:#f08a7e">END</span>'].map(t=>`<p style="margin:0;opacity:0;transition:opacity 1.4s">${t||'&nbsp;'}</p>`).join('');
 F.hidden=false;snd(220,1.5,'sine',.05);for(const p of T.children){await wait(1500);p.style.opacity=1}
 await wait(1200);$('finBtn').style.opacity=1;
}
$('finBtn').onclick=()=>{if($('finBtn').style.opacity!=='1')return;SC.melt=0;$('fin').hidden=true;$('finBtn').style.opacity=0;allR.length=0;drawMe(0);startDay(1)};
function endDay(){
 S.phase='idle';S.sat=Math.max(0,Math.min(100,S.sat));$('clock').textContent=D().wd+(D().frozen?' 15:00':' 22:00 마감');hud();
 const st=S.sat>=85?'★★★★★':S.sat>=70?'★★★★☆':S.sat>=50?'★★★☆☆':'★★☆☆☆';
 $('sumH').textContent='마감 정산 · '+S.day+'일차';
 $('sumBody').innerHTML=[['판매',S.sold+'잔'],['매출','₩'+(S.money-S.tips).toLocaleString()],['팁','₩'+S.tips.toLocaleString()],['손님 만족도',Math.round(S.sat)+'%'],['오늘의 평가',st]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
 if(DAYS[S.day+1]&&S.day<7)store.set('day',String(Math.min(7,Math.max(+store.get('day')||1,S.day+1))));
 setTimeout(()=>$('sumOv').hidden=false,900);
}
const allR=[];
$('goHome').onclick=async()=>{
 allR.push(...S.rcpt);S.rcpt=[];
 $('sumOv').hidden=true;$('home').hidden=false;drawRoom($('roomC'),1);snd(110,1.2,'sine',.05);
 $('notiTxt').textContent=D().noti?D().noti():`[마음숲의원] ${NAME||'고객'}님, 11월 20일(목) 오후 2시 예약 확인 부탁드립니다. 회신 없을 시…`;$('unread').textContent=D().unread;$('noti').style.opacity=0;
 $('notiTime').textContent=D().notiTime||'22:41';
 store.set('runs',String((+store.get('runs')||0)+1));
 const m=$('mono');m.innerHTML='';m.style.display='none'; // 독백 없음
 const eb=$('endBtn');eb.classList.remove('on');eb.textContent=D().nextLabel||(DAYS[S.day+1]?`${S.day+1}일차 출근하기`:`${S.day+1}일차 — 준비 중`);
 $('noti').style.opacity=1;snd(880,.08);
 const ps=[...m.children];let k=0;const H=$('home');let hint=$('tapHint');if(!hint){hint=document.createElement('div');hint.id='tapHint';hint.textContent='화면을 눌러 계속 ▼';H.appendChild(hint)}hint.style.display='';
 const adv=()=>{if(k<ps.length){ps[k++].classList.add('on');snd(300,.04,'triangle',.03)}if(k>=ps.length){setTimeout(()=>eb.classList.add('on'),450);hint.style.display='none';H.removeEventListener('click',adv)}};
 await wait(300);adv();H.addEventListener('click',adv);
};
$('endBtn').onclick=()=>{if(!$('endBtn').classList.contains('on'))return;if(DAYS[S.day+1])startDay(S.day+1);else $('endBtn').textContent=(S.day+1)+'일차는 다음 업데이트에서 이어져요'};

$('rcBtn').onclick=()=>{const R=allR.concat(S.rcpt);$('rcList').innerHTML='<b>카페 해피데이 · 영수증 기록</b><br>담당: '+(NAME?esc(NAME):'—')+(R.length?R.map(r=>`<div><span>${r[0]}일차 ${r[1]} ${esc(r[2])}</span><span>₩${r[3].toLocaleString()}</span></div>`).join(''):'<div><span>아직 기록 없음</span></div>')+'<p style="color:#999;margin:8px 0 0">눌러서 닫기</p>';$('rcpt').hidden=false};
$('rcpt').onclick=()=>$('rcpt').hidden=true;

let bi=0;
function bossNext(){const B=D().boss;$('bossAv').style.visibility=D().bossAbsent?'hidden':'';document.querySelector('#boss .who').textContent=D().bossAbsent?'':'곰 사장님';if(bi>=B.length){$('boss').hidden=true;next();return}{const t=B[bi++]();$('bossTxt').textContent=dist()>=5?glitch(t,.12):t}snd(660,.06,'triangle')}
$('boss').onclick=bossNext;
function startDay(d){reset(d);bi=0;SC.melt=0;SC.dead=[];SC.drips=[];SC.cam2=0;$('app').className=dist()>=3?'dist'+Math.min(5,dist()):'';hud();drawCup();$('home').hidden=true;$('title').hidden=true;$('clock').textContent=D().wd+' 15:00';$('boss').hidden=false;bossNext()}
const audio=()=>{try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}};
$('start').onclick=()=>{audio();startDay(1)};
const saved=Math.min(+store.get('day')||1,7);if(saved>=2){$('start2').hidden=false;$('start2').textContent=saved+'일차부터 하기'}
$('start2').onclick=()=>{audio();startDay(saved)};
drawMe(0);$('bossAv').appendChild(spriteCanvas(sprite('boss','happy'),23));drawLogo($('logo'));fitScn();requestAnimationFrame(loop);drawCup();hud();
}
